[include mmu/base/*.cfg]
[include mmu/optional/client_macros.cfg]
[include main.cfg]
[include macros.cfg]
[include clientvariable.cfg]
[include bedfans.cfg]
[include goose_purger.cfg]

[printer]
kinematics: corexy
max_velocity: 1000  
max_accel: 8000             
max_z_velocity: 40         
max_z_accel: 250
square_corner_velocity: 6.0

[input_shaper]
shaper_freq_x: 112.8
shaper_type_x: mzv
shaper_freq_y: 93.8
shaper_type_y: ei

[exclude_object]

[force_move]
enable_force_move: False

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_250029001051313234353230-if00
restart_method:command

[mcu EBB]
canbus_uuid: 4517c1931f0f
canbus_interface: can1

[mcu cartographer] 
canbus_uuid: c99e31d7c00a
canbus_interface: can1

[temperature_sensor Chamber]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4

[temperature_sensor BT_Box]
sensor_type: Generic 3950
sensor_pin: PF5
min_temp: 10
max_temp: 100

[temperature_sensor Raspberry_pi]
sensor_type: temperature_host

[temperature_sensor Octopus_temp]
sensor_type: temperature_mcu

[temperature_sensor EBB_MCU]
sensor_type: temperature_mcu
sensor_mcu: EBB

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

#####################################################################
#   X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PG0
dir_pin: PG1
enable_pin:!PF15
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: 0
position_endstop: 242
position_max: 242
homing_speed: 120
homing_retract_dist: 10

[tmc2240 stepper_x]
cs_pin: PD11
diag0_pin: ^!PG9
spi_bus: spi1
interpolate: True
run_current: 1.6
driver_SGT: 2
rref: 12000
home_current: 0.70

[stepper_x1]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper

[tmc2240 stepper_x1]
cs_pin: PC6
spi_bus: spi1
interpolate: True
run_current: 1.6
rref: 12000
home_current: 0.70

[stepper_y]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: 0
position_endstop: 261
position_max: 261
homing_speed: 120
use_sensorless_homing: True
homing_retract_dist: 40

[tmc2240 stepper_y]
cs_pin: PC4
diag0_pin: ^!PG6
spi_bus: spi1
interpolate: True
run_current: 1.6
driver_SGT: 2
rref: 12000
home_current: 0.70

[stepper_y1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper

[tmc2240 stepper_y1]
cs_pin: PC7
spi_bus: spi1
interpolate: True
run_current: 1.6
rref: 12000
home_current: 0.70

#####################################################################
#   TMC_Autotune
#####################################################################

[autotune_tmc stepper_x]
motor: omc-17hs19-2504s-h
voltage: 36
sgt: 2
tuning_goal: performance
extra_hysteresis: 1
[autotune_tmc stepper_y]
motor: omc-17hs19-2504s-h
voltage: 36
sgt:2 
tuning_goal: performance
extra_hysteresis: 1
[autotune_tmc stepper_x1]
motor: omc-17hs19-2504s-h
voltage: 36
tuning_goal: performance
extra_hysteresis: 1
[autotune_tmc stepper_y1]
motor: omc-17hs19-2504s-h
voltage: 36
tuning_goal: performance
extra_hysteresis: 1

#####################################################################
#   Motor_Sync
#####################################################################

[motors_sync]
axes: x,y
#    Axes on which synchronization will be performed, separated by commas.
#    For example, for CoreXY kinematics: x,y.
accel_chip: adxl345
#    Accelerometer for vibrations collection: adxl345 / mpu9250 etc.
#encoder_chip_<axis>:
#    Axis name, assigned encoder name, for measuring motor deviations.
#microsteps: 16
#    Maximum microsteps resolution relative to motor full step.
#steps_model: linear, 10000, 0
#    Mathematical model and its coefficients describing the dependence of
#    motor microstep displacement on the magnitude of the measured impulse.
#    The model determines how many microsteps the motor position is corrected
#    per one correction step depending on the measured impulse magnitude.  
#max_step_size: 3
#    Maximum number of microsteps the motor can move in one correction step
#    to achieve the planned impulse magnitude.
#axes_steps_diff:
#    Difference in motor positions in microsteps between two linked axes,
#    to start checking the position offset of the secondary axis. Relevant
#    only for CoreXY type kinematics. Default value - max_step_size + 1.
#retry_tolerance: 0
#    Forced threshold to which the motor impulse magnitude must drop for the
#    synchronization procedure to complete successfully. Recommended to
#    configure in order to filter possible measurement errors. When using an
#    accelerometer, the typical range is [200..2000].
#retries: 0
#    Maximum number of retries to reach retry_tolerance.
#head_fan:
#    Full name of the toolhead fan that will be turned off during sync to
#    eliminate its noise. Can be specified multiple fans by separating
#    their names with commas.
#axis_prefix_<axis>:
#    Allows you to set a custom prefix that will be displayed before the
#    axis name in terminal outputs. You can use special characters or
#    Unicode icons to make the axes easier to distinguish.
 
#####################################################################
#   Z Stepper Settings
#####################################################################
[stepper_z]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
rotation_distance: 8 
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 225
position_min: -5
homing_speed: 5.0 
homing_retract_speed: 4
second_homing_speed: 1.5
homing_retract_dist: 0

[tmc2240 stepper_z]
cs_pin: PE1
spi_bus: spi1
interpolate: True
run_current: 0.5
stealthchop_threshold: 0
rref: 12000

[stepper_z1]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 8    
microsteps: 32

[tmc2240 stepper_z1]
cs_pin: PF2
spi_bus: spi1
interpolate: True
run_current: 0.5
stealthchop_threshold: 0
rref: 12000

[stepper_z2]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 8 
microsteps: 32

[tmc2240 stepper_z2]
cs_pin: PE4
spi_bus: spi1
interpolate: True
run_current: 0.5
stealthchop_threshold: 0
rref: 12000

#####################################################################
#   Extruder
#####################################################################
[extruder]
step_pin: EBB:PD0
dir_pin:!EBB:PD1
enable_pin: !EBB:PD2
rotation_distance: 35.4060435456  
gear_ratio: 60:8             
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.5
filament_diameter: 1.75
heater_pin: EBB:PB13
sensor_type: MAX31865
sensor_pin: EBB:PA4
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
min_temp: 14
max_temp: 350
max_power: 1.0
min_extrude_temp: 200
#control: pid_v
#pid_kp: 26.690
#pid_ki: 2.311
#pid_kd: 77.068
pressure_advance: 0.025
pressure_advance_smooth_time: 0.02
max_extrude_cross_section: 5
max_extrude_only_distance: 120

[tmc2209 extruder]
uart_pin: EBB:PA15
interpolate: false
run_current: 0.65
sense_resistor: 0.110
stealthchop_threshold: 999999

[firmware_retraction]
retract_length: 0.9
retract_speed: 45
unretract_extra_length: 0
unretract_speed: 25


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA0
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 1.0
min_temp: 0
max_temp: 140
pwm_cycle_time: 0.02674
#control: pid_v
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

[heater_generic Heater_BT]
gcode_id: C
heater_pin: PA3
max_power: 1
pwm_cycle_time: 0.01
sensor_type: MAX31865
sensor_pin: PF8
spi_speed: 4000000
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
rtd_use_50Hz_filter: True
smooth_time: 1.0
control: pid_v
pid_kp: 19.414
pid_ki: 1.077
pid_kd: 87.486
min_temp: 10
max_temp: 110

[verify_heater Heater_BT]
max_error: 120
check_gain_time: 60
hysteresis: 30
heating_gain: 2

#####################################################################
#   Probe
#####################################################################
[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 22 
verbose: yes 

[bed_mesh]
zero_reference_position: 125, 125    
#    set this to the middle of your bed
speed: 200
#    movement speed of toolhead during bed mesh
horizontal_move_z: 4
#    height of scanner during bed mesh scan
mesh_min: 25, 5
#    start point of bed mesh [X, Y]
mesh_max: 217, 210
#    end point of bed mesh [X, Y]
probe_count: 30, 30
algorithm: bicubic


#####################################################################
#   Fan Control
#####################################################################
[heater_fan hotend_fan]
pin: EBB: PA0
max_power: 1.0
kick_start_time: 0.1
heater: extruder
heater_temp: 50.0
tachometer_pin: ^EBB:PB9
tachometer_ppr: 2
tachometer_poll_interval: 0.0009
shutdown_speed: 1.0

[heater_fan Heater_Fan_BT]
pin: PD14
cycle_time: 0.0001
max_power: 1.0
shutdown_speed: 1.0
heater: Heater_BT
heater_temp: 30.0
fan_speed: 1.0

[fan]
pin: EBB: PA1
kick_start_time: 0.2
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010

[controller_fan Electronics_1]
pin:PE5
kick_start_time: 0.5
shutdown_speed: 1.0
max_power: 1.0
fan_speed: 0.7
cycle_time: 0.01
idle_timeout: 30
stepper: stepper_z, stepper_x, stepper_y
heater: heater_bed, extruder

[controller_fan Electronics_2]
pin:PA8
kick_start_time: 0.5
shutdown_speed: 1.0
max_power: 1.0
fan_speed: 0.7
cycle_time: 0.01
idle_timeout: 30
stepper: stepper_z, stepper_x, stepper_y
heater: heater_bed, extruder

#####################################################################
#   LED Control
#####################################################################

[output_pin caselight]
pin: PB0
pwm:true
shutdown_value: 0
value:0.3
cycle_time: 0.01

[output_pin BT_Light]
pin: PB11
pwm: true
cycle_time: 0.001
value: 0.3
shutdown_value: 0

[neopixel logo_led]
pin: EBB:PD3
chain_count: 3
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0

[neopixel board_rgb]
pin: PB10
chain_count: 39
color_order: GRB
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.5

[neopixel bt_logo]
pin: mmu: PE15
chain_count: 12
color_order: GRB
initial_RED: 0.4
initial_GREEN: 0.0
initial_BLUE: 0.4

[delayed_gcode start]
initial_duration: 4
gcode:
    TOOLHEAD_LED
    MR_NOTIFY TITLE="$printer_name" MESSAGE="Ready!"
    
#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 14500

[safe_z_home]
home_y_before_x: true
home_xy_position:121,121
speed:500
z_hop:10

[z_tilt]
z_positions: 
   -50, 18
   125, 298
   300, 18

points: 
   25, 5
   121, 210
   217, 5

speed: 500
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0065
adaptive_horizontal_move_z: True

[bed_mesh]
speed: 350
horizontal_move_z: 2.5
mesh_min: 35, 35
mesh_max: 220, 220
zero_reference_position: 121, 121
probe_count: 50, 50
mesh_pps: 2, 3
algorithm: bicubic

#####################################################################
#   ADXL / Additional Outputs
#####################################################################
[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    125, 125, 20

